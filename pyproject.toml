[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiks-renderer"
version = "0.1.0"
description = "A very specific Rubik's cube renderer"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pygame",
    "numpy",
    "moderngl"
]

[tool.setuptools]
packages = ["rubiks_renderer"]

[tool.setuptools.package-data]
rubiks_renderer = ["*.vl"]